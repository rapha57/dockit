services:
  app:
    build: .
    ports:
      - "3000:3000"
    # Root for the entrypoint only (chown the data dir), then drop to PUID:PGID.
    user: "0"
    environment:
      PUID: "1000"
      PGID: "1000"
      PORTAL_EDIT_USER: admin
      # Required in production, ≥ 12 characters. No default.
      PORTAL_EDIT_PASSWORD: ""
      # SSO / LDAP secrets — keep out of portal.json (OpenShift: a Secret).
      # PORTAL_OIDC_CLIENT_SECRET: ""
      # PORTAL_LDAP_BIND_PASSWORD: ""
      PORTAL_DATA_FILE: /app/data/portal.json
      PORT: "3000"
      # Behind a reverse proxy:
      # PORTAL_PUBLIC_ORIGIN: https://portal.example
      # PORTAL_TRUST_PROXY: "1"
    volumes:
      - portal-data:/app/data
    # ICMP probes (ping). HTTP probes work without this.
    # OpenShift restricted SCC: omit cap_add — ICMP reports unavailable.
    cap_add:
      - NET_RAW

volumes:
  portal-data:
