name: Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (e.g. 2026.09.15.4)
        required: true

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - id: tag
        run: echo "name=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dockit:scan
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Node's bundled npm under usr/local/lib/node_modules is base-image noise.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dockit:scan
          scanners: vuln,secret
          vuln-type: library
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
          skip-dirs: usr/local/lib/node_modules
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dockit:scan
          scanners: vuln
          format: cyclonedx
          output: dockit-${{ steps.tag.outputs.name }}.cdx.json
          skip-dirs: usr/local/lib/node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.tag.outputs.name }}
          path: dockit-${{ steps.tag.outputs.name }}.cdx.json
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.name }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.name }}
          cache-from: type=gha
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ steps.tag.outputs.name }}" "dockit-${{ steps.tag.outputs.name }}.cdx.json" --clobber

